name: CI

on:
  schedule:
    # twice a week, on sundays, fridays at 8:00am UTC
    - cron: "0 8 * * 0,5"
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup bats
        uses: bats-core/bats-action@4.1.0
        with:
          bats-version: 1.14.0
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out code
        uses: actions/checkout@v7

      - name: Run tests
        run: make test
        env:
          GH_TOC_TOKEN: ${{ secrets.GITHUB_TOKEN }}
